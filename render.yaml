services:
  - type: web
    name: magicpin-vera-bot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python dataset/generate_dataset.py --seed-dir dataset --out expanded
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: TEAM_NAME
        value: "Team Vera"
      - key: MODEL_NAME
        value: "vera-deterministic-composer-v1"
